<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Ajustes — Dark Owl</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- iconos:inicio — generado por scripts/iconos.js, no editar a mano -->
    <!-- Lucide 1.41.0 (https://lucide.dev), licencia ISC. -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="3" width="5" height="18" rx="1" /> <rect x="5" y="3" width="5" height="18" rx="1" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></symbol>
      <symbol id="i-again" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /></symbol>
      <symbol id="i-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11v6" /> <path d="M14 11v6" /> <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /> <path d="M3 6h18" /> <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17H5" /> <path d="M19 7h-9" /> <circle cx="17" cy="17" r="3" /> <circle cx="7" cy="7" r="3" /></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /></symbol>
      <symbol id="i-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></symbol>
      <symbol id="i-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2" /> <line x1="8" x2="16" y1="21" y2="21" /> <line x1="12" x2="12" y1="17" y2="21" /></symbol>
      <symbol id="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /> <path d="M12 2v2" /> <path d="M12 20v2" /> <path d="m4.93 4.93 1.41 1.41" /> <path d="m17.66 17.66 1.41 1.41" /> <path d="M2 12h2" /> <path d="M20 12h2" /> <path d="m6.34 17.66-1.41 1.41" /> <path d="m19.07 4.93-1.41 1.41" /></symbol>
      <symbol id="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></symbol>
    </svg>
    <!-- iconos:fin -->

    <div class="win">
      <header class="bar">
        <span class="marca">Ajustes</span>
        <div class="bar__ctl">
          <button id="min" class="wbtn" title="Minimizar" aria-label="Minimizar">
            <svg><use href="#i-min" /></svg>
          </button>
          <button id="close" class="wbtn wbtn--x" title="Cerrar" aria-label="Cerrar">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
      </header>

      <section class="ajustes">
        <div class="opcion">
          <span class="opcion__nombre">Tema</span>
          <div id="tema" class="iconos" role="group" aria-label="Esquema de color">
            <button type="button" data-valor="sistema" title="Seguir al sistema" aria-label="Seguir al sistema" aria-pressed="false">
              <svg><use href="#i-system" /></svg>
            </button>
            <button type="button" data-valor="claro" title="Claro" aria-label="Claro" aria-pressed="false">
              <svg><use href="#i-light" /></svg>
            </button>
            <button type="button" data-valor="oscuro" title="Oscuro" aria-label="Oscuro" aria-pressed="false">
              <svg><use href="#i-dark" /></svg>
            </button>
          </div>
        </div>

        <div class="opcion">
          <span class="opcion__nombre">Entrada</span>
          <select id="mic" class="sel" aria-label="Micrófono"></select>
          <button id="recargar" class="tool" title="Buscar dispositivos de nuevo" aria-label="Buscar dispositivos de nuevo">
            <svg><use href="#i-reload" /></svg>
          </button>
        </div>

        <div class="opcion">
          <span class="opcion__nombre"></span>
          <button id="probar" type="button" class="btn">Probar</button>
          <canvas id="nivel" class="viz viz--prueba" width="1" height="1"></canvas>
        </div>

        <p id="micNota" class="aviso" hidden></p>
      </section>

      <i class="asa asa--der" data-ejes="x"></i>
      <i class="asa asa--abajo" data-ejes="y"></i>
      <i class="asa asa--esquina" data-ejes="xy"></i>
    </div>

    <script src="tema.js"></script>
    <script src="asas.js"></script>
    <script src="nivel.js"></script>
    <script src="microfono.js"></script>
    <script src="recorder.js"></script>
    <script src="viz.js"></script>
    <script src="ajustes-ui.js"></script>
  </body>
</html>
