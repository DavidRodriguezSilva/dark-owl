<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:"
    />
    <title>Dark Owl</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>

      <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></symbol>
      <symbol id="i-again" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /></symbol>
      <symbol id="i-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11v6" /> <path d="M14 11v6" /> <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /> <path d="M3 6h18" /> <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></symbol>

      <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.835V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2h-.343" /> <path d="M14 2v5a1 1 0 0 0 1 1h5" /> <path d="M2 19a2 2 0 0 1 4 0v1a2 2 0 0 1-4 0v-4a6 6 0 0 1 12 0v4a2 2 0 0 1-4 0v-1a2 2 0 0 1 4 0" /></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /></symbol>

      <symbol id="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></symbol>
    </svg>
    <!-- iconos:fin -->

    <div class="win">
      <header class="bar">
        <span id="engine" class="dot" title="comprobando engine…"></span>
        <span class="marca">Dark Owl</span>
        <div class="bar__ctl">
          <button id="min" class="wbtn" title="Minimizar" aria-label="Minimizar">
            <svg><use href="#i-min" /></svg>
          </button>
          <button id="close" class="wbtn wbtn--x" title="Cerrar" aria-label="Cerrar">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
      </header>

      <section class="deck">
        <output id="timer" class="timer">00:00</output>
        <canvas id="viz" class="viz" width="1" height="1"></canvas>
        <button id="record" class="key key--rec" title="Grabar" aria-label="Grabar" disabled>
          <svg><use href="#i-rec" /></svg>
        </button>
        <button id="pause" class="key" title="Pausar" aria-label="Pausar" disabled>
          <svg><use href="#i-pause" /></svg>
        </button>
        <button id="stop" class="key" title="Detener" aria-label="Detener" disabled>
          <svg><use href="#i-stop" /></svg>
        </button>
        <button id="open" class="key key--sec" title="Transcribir un archivo de audio" aria-label="Transcribir un archivo de audio" disabled>
          <svg><use href="#i-file" /></svg>
        </button>
        <input id="file" type="file" accept="audio/*,.mp3,.m4a,.aac,.ogg,.opus,.oga,.wav,.flac,.webm" hidden />
        <button id="gear" class="key key--sec" title="Ajustes" aria-label="Ajustes">
          <svg><use href="#i-gear" /></svg>
        </button>
      </section>

      <section id="panel" class="panel" hidden>
        <textarea id="text" placeholder="…" spellcheck="false"></textarea>
        <div class="tools">
          <button id="copy" class="tool" title="Copiar" aria-label="Copiar">
            <svg><use href="#i-copy" /></svg>
          </button>
          <button id="reprocess" class="tool" title="Reprocesar" aria-label="Reprocesar" disabled>
            <svg><use href="#i-again" /></svg>
          </button>
          <button id="clear" class="tool" title="Limpiar" aria-label="Limpiar">
            <svg><use href="#i-clear" /></svg>
          </button>
        </div>
      </section>
      <i class="asa asa--der" data-ejes="x"></i>
      <i class="asa asa--abajo" data-ejes="y"></i>
      <i class="asa asa--esquina" data-ejes="xy"></i>
    </div>

    <script src="tema.js"></script>
    <script src="asas.js"></script>
    <script src="nivel.js"></script>
    <script src="microfono.js"></script>
    <script src="recorder.js"></script>
    <script src="archivo.js"></script>
    <script src="viz.js"></script>
    <script src="app.js"></script>
  </body>
</html>
