<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:"
    />
    <title>Whisper App</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="3.8" height="13" rx="1.2" /><rect x="13.7" y="5.5" width="3.8" height="13" rx="1.2" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.4a1.1 1.1 0 0 1 1.7-.95l9 6.6a1.1 1.1 0 0 1 0 1.9l-9 6.6A1.1 1.1 0 0 1 7.5 18.6z" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.4" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5" /><path d="M5 15.5V5.5a2 2 0 0 1 2-2h8" /></symbol>
      <symbol id="i-again" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 3.5V8h-4.5" /></symbol>
      <symbol id="i-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M10 7V4.8h4V7M6.5 7l.9 12.2h9.2L17.5 7M10.2 11v5M13.8 11v5" /></symbol>
      <symbol id="i-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17" /></symbol>
    </svg>

    <div class="win">
      <header class="bar">
        <span id="engine" class="dot" title="comprobando engine…"></span>
        <span class="marca">Whisper</span>
        <div class="bar__ctl">
          <button id="min" class="wbtn" title="Minimizar" aria-label="Minimizar">
            <svg><use href="#i-min" /></svg>
          </button>
          <button id="close" class="wbtn wbtn--x" title="Cerrar" aria-label="Cerrar">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
      </header>

      <section class="deck">
        <output id="timer" class="timer">00:00</output>
        <button id="record" class="key key--rec" title="Grabar" aria-label="Grabar" disabled>
          <svg><use href="#i-rec" /></svg>
        </button>
        <button id="pause" class="key" title="Pausar" aria-label="Pausar" disabled>
          <svg><use href="#i-pause" /></svg>
        </button>
        <button id="stop" class="key" title="Detener" aria-label="Detener" disabled>
          <svg><use href="#i-stop" /></svg>
        </button>
        <canvas id="viz" class="viz" width="1" height="1"></canvas>
      </section>

      <section id="panel" class="panel" hidden>
        <textarea id="text" placeholder="…" spellcheck="false"></textarea>
        <div class="tools">
          <button id="copy" class="tool" title="Copiar" aria-label="Copiar">
            <svg><use href="#i-copy" /></svg>
          </button>
          <button id="reprocess" class="tool" title="Reprocesar" aria-label="Reprocesar" disabled>
            <svg><use href="#i-again" /></svg>
          </button>
          <button id="clear" class="tool" title="Limpiar" aria-label="Limpiar">
            <svg><use href="#i-clear" /></svg>
          </button>
        </div>
      </section>
    </div>

    <script src="nivel.js"></script>
    <script src="recorder.js"></script>
    <script src="viz.js"></script>
    <script src="app.js"></script>
  </body>
</html>
