<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:"
    />
    <title>Whisper App</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- Iconos definidos una vez y referenciados con <use>. -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="6" width="3.4" height="12" rx="1" /><rect x="13.6" y="6" width="3.4" height="12" rx="1" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 6.2a1 1 0 0 1 1.5-.87l8 5.8a1 1 0 0 1 0 1.74l-8 5.8A1 1 0 0 1 8.5 17.8z" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" /></symbol>
      <symbol id="i-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V5h4v2M6 7l1 12h10l1-12M10 11v5M14 11v5" /></symbol>
      <symbol id="i-again" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4" /></symbol>
    </svg>

    <main class="app">
      <section class="stage">
        <span id="engine" class="dot" title="comprobando engine…"></span>
        <output id="timer" class="timer">00:00</output>
        <div class="pad">
          <button id="record" class="icon icon--rec" title="Grabar" aria-label="Grabar" disabled>
            <svg><use href="#i-rec" /></svg>
          </button>
          <button id="pause" class="icon" title="Pausar" aria-label="Pausar" disabled>
            <svg><use href="#i-pause" /></svg>
          </button>
          <button id="stop" class="icon" title="Detener" aria-label="Detener" disabled>
            <svg><use href="#i-stop" /></svg>
          </button>
        </div>
      </section>

      <section class="output">
        <textarea id="text" placeholder="…" spellcheck="false"></textarea>
        <div class="pad pad--end">
          <button id="reprocess" class="icon icon--sm" title="Reprocesar" aria-label="Reprocesar" disabled>
            <svg><use href="#i-again" /></svg>
          </button>
          <button id="clear" class="icon icon--sm" title="Limpiar" aria-label="Limpiar" disabled>
            <svg><use href="#i-clear" /></svg>
          </button>
        </div>
      </section>
    </main>
    <script src="nivel.js"></script>
    <script src="recorder.js"></script>
    <script src="app.js"></script>
  </body>
</html>
