schema: spec-driven

context: |
  Producto: `dark-owl`, grabadora minimalista de voz a texto 100% offline
  sobre whisper.cpp. Una ventana pequeña, un solo ciclo: grabar →
  pausar/reanudar → detener → esperar transcripción → texto → limpiar o
  reprocesar. Audios cortos, sin cuentas, sin nube, sin telemetría. Parte de
  la familia DarkForest, junto a dark-echo. Ver `openspec/project.md` para el
  contexto completo — propósito, stack, decisiones ya tomadas, layout,
  convenciones y verificación — y `docs/referencia-whisperpress.md` para el
  porqué de cada decisión de audio y sus calibraciones.

  Fuera de alcance: hotkeys globales, inyección de texto en otras apps,
  historial de notas, importar audio, capturar audio del sistema, resúmenes
  con LLM, traducción, i18n. El norte es "súper pequeña, súper minimalista".

  Stack: Electron (main/preload/renderer) con HTML+CSS+JS plano, sin
  framework, sin bundler, sin TypeScript; `contextIsolation: true` y el
  renderer limitado a `window.api`; whisper.cpp compilado desde fuente vía
  CMake a `vendor/`; pnpm; cero dependencias en runtime. Cross-platform
  Linux + Windows, desarrollado y probado en Linux/WSL2.

  El engine se compila desde fuente porque los releases sin firmar de
  whisper.cpp y de apps Electron similares los marcan SmartScreen y los
  antivirus. Nunca se versiona ni se descarga un binario de terceros.

  "whisper" nombra al motor (`whisper.cpp`, `whisper-server`,
  `setup-whisper.js`); el producto es `dark-owl`. No fundir ambos.

  Ninguna llamada de red en runtime; la red sólo se toca en `pnpm run setup`.
  Excepción: `127.0.0.1` contra nuestro propio `whisper-server`.

  Convención de commits: mensajes en español, imperativo, estilo Conventional
  Commits (`feat: ...`), sin firma manual además del `Co-Authored-By` que
  añade la herramienta.

rules:
  proposal:
    - Cada propuesta debe justificarse contra el alcance minimalista; si añade
      superficie de UI, decir explícitamente qué se saca o por qué cabe.
    - Incluir siempre una sección "Fuera de alcance".
    - Si algo ya está resuelto en las "Decisiones técnicas ya tomadas" de
      `project.md`, referenciarlo en vez de volver a decidirlo.
  design:
    - Indicar qué corre en main y qué en renderer, y qué canal IPC los une.
    - Toda API nueva expuesta al renderer se lista explícitamente, con su forma.
    - Señalar si introduce una dependencia en runtime y por qué no se puede
      evitar.
    - Un ajuste que sólo cambie parámetros aceptados por petición en
      `POST /inference` debe decirlo: no requiere reiniciar el motor, y
      proponer un reinicio sería un coste inventado.
  tasks:
    - Trocear en tareas de máximo 2 horas.
    - La última tarea de cada cambio es verificarlo con la app corriendo
      (`pnpm start`), no sólo con pruebas.
    - Las tareas que dependan de hardware o de un sistema que no se puede
      probar desde el entorno de desarrollo (micrófonos reales, Windows,
      SmartScreen) se marcan como manuales del propietario en vez de darse por
      completas con una aproximación.

operations:
  apply:
    guidance:
      - Verificar sintaxis con `node --check` en los archivos JS tocados.
      - No versionar nada bajo `vendor/`.
      - Al tocar audio, probar el ciclo completo con voz real: el silencio y
        los clips de menos de un segundo son los que rompen.
      - Si se tocan los umbrales de la puerta de voz, repetir el barrido contra
        habla real; no moverlos a ojo.
  archive:
    guidance:
      - Resumir en una línea qué quedó fuera de alcance y por qué.
